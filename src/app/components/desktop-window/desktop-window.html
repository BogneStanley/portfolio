<section
  class="window"
  [class.window--compact]="windowId() !== 'projects'"
  [attr.aria-label]="title()"
  [style.--window-top]="top() + dragY() + 'px'"
  [style.--window-offset]="offsetX() + dragX() + 'px'"
  [style.z-index]="layer()"
  (pointerdown)="activated.emit()"
>
  <header
    class="window__header"
    (pointerdown)="startDrag($event)"
    (pointermove)="moveDrag($event)"
    (pointerup)="endDrag($event)"
    (pointercancel)="endDrag($event)"
    (lostpointercapture)="endDrag($event)"
  >
    <div class="window__identity">
      <app-icon [name]="windowId()" />
      <h2>{{ title() }}</h2>
      <span>{{ subtitle() }}</span>
    </div>
    <div class="window__controls">
      <button
        class="window__minimize"
        type="button"
        [attr.aria-label]="'Réduire ' + title()"
        (click)="minimize()"
      >
        <app-icon name="minus" /></button
      ><button
        class="window__close"
        type="button"
        [attr.aria-label]="'Fermer ' + title()"
        (click)="close()"
      >
        <app-icon name="close" />
      </button>
    </div>
  </header>
  <div class="window__content"><ng-content /></div>
</section>
