map $uri $portfolio_cache_control {
    default "no-cache";
    "~*/[^/]+-[a-z0-9]{8,}\.(js|css)$" "public, max-age=31536000, immutable";
    ~*\.(js|css|svg|png|webp|ico|pdf|json)$ "public, max-age=3600";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $portfolio_cache_control;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location ~* \.(?:js|css|svg|png|webp|ico|pdf|txt|xml|json)$ {
        try_files $uri =404;
    }

    # Angular handles navigation; missing assets above keep a genuine 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
