name: Test and deploy portfolio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run test:seo
      - run: npm run test:deploy
      - run: npm run build
      - name: Validate Traefik configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build runtime image
        run: docker build -t portfolio:ci .
      - name: Check Nginx and HTTP responses
        run: |
          docker run --rm portfolio:ci nginx -t
          docker run -d --name portfolio-ci -p 127.0.0.1:8080:80 portfolio:ci
          trap 'docker rm -f portfolio-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          node scripts/check-http.mjs http://127.0.0.1:8080

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate deployment settings
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo 'SSH_HOST manquant ou invalide'; exit 1; }
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo 'SSH_USER manquant ou invalide'; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$SSH_PORT > 0 && 10#$SSH_PORT <= 65535)) || { echo 'SSH_PORT invalide'; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/([a-zA-Z0-9_.-]+/)*[a-zA-Z0-9_.-]+$ && "$DEPLOY_PATH/" != *'/../'* && "$DEPLOY_PATH/" != *'/./'* ]] || { echo 'DEPLOY_PATH manquant ou invalide'; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo 'SSH_PRIVATE_KEY manquant'; exit 1; }
      - name: Archive exact tested revision
        run: git archive --format=tar HEAD | gzip > portfolio.tar.gz
      - name: Prepare remote release
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || '22' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: DEPLOY_PATH,GITHUB_SHA
          command_timeout: 1m
          script: |
            set -eu
            test -f "$DEPLOY_PATH/.env"
            mkdir -p "$DEPLOY_PATH/incoming" "$DEPLOY_PATH/releases/$GITHUB_SHA"
      - name: Transfer release archive
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || '22' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: portfolio.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}/incoming
          overwrite: true
          command_timeout: 5m
      - name: Deploy and verify health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || '22' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: DEPLOY_PATH,GITHUB_SHA
          command_timeout: 25m
          script: |
            set -eu
            tar -xzf "$DEPLOY_PATH/incoming/portfolio.tar.gz" -C "$DEPLOY_PATH/releases/$GITHUB_SHA"
            bash "$DEPLOY_PATH/releases/$GITHUB_SHA/scripts/deploy.sh" "$DEPLOY_PATH" "$GITHUB_SHA"
